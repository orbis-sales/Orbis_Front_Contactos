# =============================================================================
# Prueba y publica la imagen de orbis-web-cdp.
#
#   push a `qa`   → publica la imagen :qa
#   push a `main` → publica la imagen :main
#
# Esta app no tiene pruebas propias: la verificacion es `next build`, que corre
# DENTRO del Dockerfile. Si el build falla, el docker build falla y no se
# publica nada. La proteccion existe igual, solo que no es un paso aparte.
#
# Por que se clona tambien orbis-infra: el Dockerfile vive alli y construye
# con el contexto en la carpeta que contiene los repos, no en la de la app.
#
# Los paquetes compartidos se instalan de GitHub Packages, no del disco.
# =============================================================================
name: Publicar imagen

on:
  push:
    branches: [main, qa]

concurrency:
  group: publicar-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGEN: ghcr.io/orbis-sales/orbis-web-cdp

jobs:
  publicar:
    runs-on: ubuntu-latest
    # De que ambiente salen las variables de abajo. Next las hornea al
    # construir, asi que la imagen :qa y la :main tienen que salir de builds
    # distintos: si compartieran valores, el front de produccion le hablaria
    # al backend de qa.
    environment: ${{ github.ref_name == 'main' && 'produccion' || 'qa' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          path: orbis-web-cdp

      - uses: actions/checkout@v5
        with:
          repository: orbis-sales/Orbis_Infra
          token: ${{ secrets.ORBIS_REPOS_TOKEN }}
          path: orbis-infra

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: orbis-infra/Dockerfile.web
          build-args: |
            APP=orbis-web-cdp
            PUERTO=3005
          # Secreto, no build-arg: existe solo durante el npm install y no
          # queda en ninguna capa de la imagen publicada.
          secrets: |
            npm_token=${{ secrets.ORBIS_REPOS_TOKEN }}
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.ref_name }}
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
